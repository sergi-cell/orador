<style>
/* Tema oscuro único y deliberado: es una "System UI" de Solo Leveling,
   un modo claro rompería el lenguaje de glow sobre negro. */
:root{
  color-scheme:dark;
  --bg:#05070c; --panel:#0b1119; --panel2:#0e1622;
  --cyan:#35e8ff; --purple:#a45bff; --pink:#ff3fb0;
  --text:#dfe8f5; --dim:#7688a3; --danger:#ff5f6d; --gold:#ffc24b;
  --line:rgba(53,232,255,.22);
  --font-head:'Avenir Next Condensed','HelveticaNeue-CondensedBold','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,'JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
body{
  margin:0; min-height:100vh; background:
    radial-gradient(circle at 20% -10%, rgba(164,91,255,.18), transparent 45%),
    radial-gradient(circle at 100% 10%, rgba(63,240,255,.14), transparent 40%),
    var(--bg);
  color:var(--text); font-family:var(--font-body); letter-spacing:.01em;
  overflow-x:hidden;
}
#app{max-width:520px;margin:0 auto;padding:18px 16px 60px;min-height:100vh}
.hud-panel{
  background:linear-gradient(180deg, var(--panel), var(--panel2));
  border:1px solid var(--line);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  position:relative; padding:16px; margin-bottom:14px;
}
.hud-panel::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 20px rgba(63,240,255,.05);
}
.glow-cyan{color:var(--cyan);text-shadow:0 0 12px rgba(63,240,255,.6)}
.glow-purple{color:var(--purple);text-shadow:0 0 12px rgba(164,91,255,.6)}
h1,h2,h3{font-family:var(--font-head);margin:0 0 6px;font-weight:800;letter-spacing:.03em}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim);font-size:.8rem}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.brand{font-size:1.4rem;font-weight:900;letter-spacing:.15em}
.brand span{color:var(--cyan)}
.rank-badge{
  font-family:var(--font-mono);font-weight:900;font-size:1.1rem;
  border:2px solid var(--gold);color:var(--gold);border-radius:6px;
  padding:2px 10px;text-shadow:0 0 8px rgba(255,207,92,.7);

.big-btn{
  display:block;width:100%;padding:22px 16px;margin:18px 0;
  background:linear-gradient(135deg, rgba(63,240,255,.15), rgba(164,91,255,.15));
  border:1px solid var(--cyan); color:var(--cyan);
  font-family:var(--font-head);font-size:1.25rem;font-weight:900;letter-spacing:.04em;
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);

  box-shadow:0 0 24px rgba(63,240,255,.15);
}
.big-btn:active{transform:scale(.98)}
.btn{
  display:inline-block;padding:10px 16px;background:var(--panel2);
  border:1px solid rgba(255,255,255,.15);color:var(--text);
  font-family:var(--font-head);font-weight:700;cursor:pointer;border-radius:4px;
  text-align:center;
}
.btn.primary{border-color:var(--cyan);color:var(--cyan)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.1);color:var(--dim)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel2);border:1px solid rgba(255,255,255,.08);padding:10px;text-align:center;border-radius:4px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}

  font-family:var(--font-mono);font-size:.7rem;border-radius:4px;

.emotion-badge{
  display:inline-flex;align-items:center;gap:8px;font-size:1.1rem;font-weight:900;
  padding:8px 14px;border-radius:20px;margin-bottom:14px;font-family:var(--font-mono);

.timer{font-family:var(--font-mono);font-size:2.6rem;font-weight:900;text-align:center;color:var(--cyan);text-shadow:0 0 16px rgba(53,232,255,.5);font-variant-numeric:tabular-nums}
.slider-row{margin:12px 0}
.slider-row label{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--cyan)}
textarea,input[type=text]{
  width:100%;background:var(--panel2);border:1px solid rgba(255,255,255,.12);
  color:var(--text);padding:10px;font-family:var(--font-head);border-radius:4px;
}
.card-list .item{
  background:var(--panel2);border:1px solid rgba(255,255,255,.08);
  padding:12px;margin-bottom:8px;border-radius:4px;cursor:pointer;
}
.card-list .item:hover{border-color:var(--cyan)}
.tag{display:inline-block;font-family:var(--font-mono);font-size:.65rem;padding:2px 8px;border-radius:10px;background:rgba(164,91,255,.15);color:var(--purple);margin-left:6px}
.locked{opacity:.45}
.nav{display:flex;gap:6px;margin-top:22px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
.nav .btn{flex:1;font-size:.75rem;padding:8px 4px}
.pulse-word{font-family:var(--font-mono);font-weight:900;font-size:1.05rem;color:var(--purple);padding:6px 10px;border:1px dashed var(--purple);border-radius:4px;text-align:center}
video.mirror{width:100%;border-radius:8px;transform:scaleX(-1);background:#000;margin-bottom:10px}
.pause-short{color:var(--dim)}
.pause-long{color:var(--purple);font-weight:900}
.emph{color:var(--gold);font-weight:900}
.speed-tag{font-family:var(--font-mono);font-size:.7rem;color:var(--pink);border:1px solid var(--pink);border-radius:3px;padding:1px 6px;margin:0 4px}

/* en movil: respeta la barra de estado / notch al instalarse como app */
#app{padding-top:calc(18px + env(safe-area-inset-top));padding-bottom:calc(60px + env(safe-area-inset-bottom))}
/* evita el zoom por doble toque y el retardo de 300ms en iOS */
button,.item,.d{touch-action:manipulation}

.flash-overlay{
  position:fixed;inset:0;pointer-events:none;z-index:99;
  background:radial-gradient(circle at 50% 50%, rgba(53,232,255,.35), transparent 70%);
  animation:flashfade .65s ease-out forwards;
}
.flash-overlay.gold{background:radial-gradient(circle at 50% 50%, rgba(255,194,75,.4), transparent 70%)}
@keyframes flashfade{from{opacity:1}to{opacity:0}}
.levelup-toast{
  position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:100;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--gold);padding:16px 26px;text-align:center;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  box-shadow:0 0 40px rgba(255,194,75,.3);animation:flashfade 2.4s ease-out forwards;
}
.sound-toggle{
  background:none;border:1px solid rgba(255,255,255,.15);color:var(--dim);
  border-radius:4px;padding:4px 9px;cursor:pointer;font-size:.95rem;line-height:1;
}
</style>

<script>
/* ---------------- sonido (motor portado de la app de hábitos) ----------------
   El arreglo clave para iOS: si programas un sonido en un AudioContext todavía
   "suspended", el sonido se descarta en silencio — no da error, no suena.
   whenRunning() no programa nada hasta que el motor confirma que está corriendo. */
let audioCtx = null;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function soundOn(){ return localStorage.getItem('orador_sound') !== 'off'; }
function whenRunning(fn){
  if(!soundOn()) return;
  try{
    const ctx = getCtx();
    if(ctx.state === 'running'){ fn(ctx); return; }
    ctx.resume().then(()=>{ if(ctx.state === 'running') fn(ctx); }).catch(()=>{});
  }catch(e){ /* audio no disponible */ }
}
let audioUnlockDone = false;
function unlockAudio(){
  if(audioUnlockDone) return;
  whenRunning(ctx=>{
    try{
      const b = ctx.createBuffer(1,1,22050);
      const s = ctx.createBufferSource();
      s.buffer = b; s.connect(ctx.destination); s.start(0);
      audioUnlockDone = true;
    }catch(e){}
  });
}
// se reintenta en cada toque de los primeros, no solo en el primero: así el motor
// ya está caliente cuando el usuario toca el botón que de verdad suena
['touchstart','touchend','mousedown','click'].forEach(evt=>{
  document.addEventListener(evt, unlockAudio, {capture:true});
});

function beep(freq,duration,type,startTime,gainVal){
  whenRunning(ctx=>{ try{
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type=type; osc.frequency.value=freq;
    osc.connect(gain).connect(ctx.destination);
    const t=ctx.currentTime+startTime;
    osc.start(t);
    gain.gain.setValueAtTime(gainVal,t);
    gain.gain.exponentialRampToValueAtTime(0.001,t+duration);
    osc.stop(t+duration+0.02);
  }catch(e){} });
}
function sweep(f1,f2,duration,startTime,gainVal,type){
  whenRunning(ctx=>{ try{
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type=type||'sawtooth';
    const t=ctx.currentTime+startTime;
    osc.frequency.setValueAtTime(f1,t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    gain.gain.setValueAtTime(gainVal,t);
    gain.gain.exponentialRampToValueAtTime(0.001,t+duration);
    osc.stop(t+duration+0.02);
  }catch(e){} });
}
function thump(freq,duration,startTime,gainVal){
  whenRunning(ctx=>{ try{
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type='sine';
    const t=ctx.currentTime+startTime;
    osc.frequency.setValueAtTime(freq,t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1,freq*0.4),t+duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    gain.gain.setValueAtTime(gainVal,t);
    gain.gain.exponentialRampToValueAtTime(0.001,t+duration);
    osc.stop(t+duration+0.02);
  }catch(e){} });
}
function noiseBurst(duration,startTime,gainVal,filterFreq,filterType){
  whenRunning(ctx=>{ try{
    const size=Math.max(1,Math.floor(ctx.sampleRate*duration));
    const buffer=ctx.createBuffer(1,size,ctx.sampleRate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<size;i++) data[i]=Math.random()*2-1;
    const noise=ctx.createBufferSource(); noise.buffer=buffer;
    const filter=ctx.createBiquadFilter();
    filter.type=filterType||'bandpass';
    filter.frequency.value=filterFreq||1200;
    const gain=ctx.createGain();
    const t=ctx.currentTime+startTime;
    gain.gain.setValueAtTime(gainVal,t);
    gain.gain.exponentialRampToValueAtTime(0.001,t+duration);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(t); noise.stop(t+duration+0.02);
  }catch(e){} });
}
function vibrate(pattern){
  try{ if(navigator.vibrate && soundOn()) navigator.vibrate(pattern); }catch(e){}
}
function flashScreen(gold){
  const el=document.createElement('div');
  el.className='flash-overlay'+(gold?' gold':'');
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),650);
}

/* sonidos con nombre */
function sfxTap(){ beep(880,0.03,'square',0,0.05); }
function sfxStart(){
  sweep(300,1200,0.22,0,0.07,'sawtooth');
  noiseBurst(0.12,0,0.03,3500,'highpass');
  beep(1400,0.08,'square',0.2,0.08);
}
function sfxTick(){ beep(1000,0.04,'square',0,0.07); }
function sfxTimeUp(){
  beep(880,0.12,'square',0,0.10);
  beep(660,0.12,'square',0.13,0.10);
  beep(440,0.22,'square',0.26,0.10);
  thump(110,0.3,0.26,0.12);
}
function sfxComplete(){
  beep(1200,0.05,'square',0,0.12);
  beep(1800,0.08,'square',0.05,0.10);
  thump(150,0.12,0,0.10);
}
function sfxFiller(){ beep(220,0.09,'sawtooth',0,0.09); }
function sfxEmotion(){ beep(1320,0.05,'sine',0,0.06); }
function sfxLevelUp(){
  sweep(300,2400,0.45,0,0.08,'sawtooth');
  noiseBurst(0.3,0,0.05,4000,'highpass');
  [523.25,659.25,783.99,1046.5,1318.51].forEach((f,i)=>beep(f,0.16,'square',0.15+i*0.09,0.10));
  thump(90,0.3,0.5,0.14);
}
function sfxRankUp(){
  sweep(150,3200,0.6,0,0.09,'sawtooth');
  noiseBurst(0.4,0,0.06,6000,'highpass');
  [196,392,523.25,659.25,783.99,1046.5,1318.51].forEach((f,i)=>beep(f,0.2,'triangle',0.1+i*0.08,0.11));
  thump(60,0.45,0.65,0.16);
}

    ]},
    {title:'El vecino nuevo', segments:[
      {e:'curioso', t:'El vecino nuevo apenas hablaba, cargaba cajas él solo y evitaba mirar a los ojos.'},
      {e:'misterioso', t:'Una noche escuchó gritos desde su piso, después silencio total durante tres días seguidos.'},
      {e:'enfadado', t:'Llamó a la puerta dispuesto a exigir explicaciones, casi convencido de que algo grave pasaba ahí dentro.'},
      {e:'triste', t:'El vecino abrió llorando: acababa de perder a su pareja y no sabía cómo decírselo a nadie.'},
      {e:'inspirador', t:'Esa noche se sentaron en el rellano a hablar. Hoy son la familia que ninguno de los dos eligió, pero necesitaba.'}
    ]},
    {title:'La renuncia', segments:[
      {e:'neutro', t:'Escribió la carta de renuncia tres veces distintas antes de decidirse a entregarla.'},
      {e:'enfadado', t:'Diez años dando la cara por una empresa que nunca reconoció su trabajo en público.'},
      {e:'curioso', t:'Su jefe, al leerla, le preguntó algo que no esperaba: "¿Qué necesitarías para quedarte?"'},
      {e:'feliz', t:'Nadie le había hecho esa pregunta en una década. Y tenía, de hecho, una respuesta clara.'},
      {e:'inspirador', t:'Se quedó, con otro cargo y otro sueldo. A veces renunciar es solo pedir, en voz alta, lo que mereces.'}
    ]},
    {title:'El préstamo', segments:[
      {e:'neutro', t:'Pidió prestado a su hermano el dinero que le faltaba para abrir la tienda.'},
      {e:'feliz', t:'El primer año fue mejor de lo esperado: devolvió el préstamo en ocho meses, no en dos años.'},
      {e:'misterioso', t:'Pero su hermano nunca quiso cobrar los intereses que habían pactado, sin dar ninguna explicación.'},
      {e:'curioso', t:'Un día encontró, sin buscarla, la razón: años atrás, alguien había hecho lo mismo por su hermano.'},
      {e:'inspirador', t:'Ahora presta dinero, sin intereses, a quien empieza. La cadena que nadie ve, sigue funcionando igual.'}
    ]},
    {title:'La boda', segments:[
      {e:'feliz', t:'Faltaban dos horas para la boda y el catering aún no había llegado al salón.'},
      {e:'enfadado', t:'Llamó a la empresa gritando, amenazando con denunciarlos, sin conseguir ninguna solución real.'},
      {e:'curioso', t:'Su futura suegra, en silencio, sacó el teléfono e hizo tres llamadas que nadie esperaba.'},
      {e:'misterioso', t:'Una hora después llegó comida de cuatro restaurantes distintos del barrio, sin que nadie supiera cómo.'},
      {e:'inspirador', t:'Fue la boda más recordada del año. No por el catering perfecto, sino por el que nunca llegó.'}
    ]},
    {title:'El diario', segments:[
      {e:'neutro', t:'Encontró el diario de su abuela mientras ordenaba el trastero de la casa familiar.'},
      {e:'curioso', t:'La última página, sin terminar, hablaba de un negocio que nunca llegó a montar.'},
      {e:'triste', t:'Se dio cuenta de que su abuela había tenido miedo, toda su vida, de intentarlo de verdad.'},
      {e:'inspirador', t:'Decidió terminar esa idea, ochenta años después, con el mismo nombre que su abuela había escrito.'},
      {e:'feliz', t:'Hoy ese negocio factura más que ningún otro de la familia. Lleva el nombre de su abuela en el logo.'}
    ]},
    {title:'La entrevista', segments:[
      {e:'neutro', t:'Llegó veinte minutos tarde a la entrevista más importante de su vida, por un accidente de tráfico.'},
      {e:'enfadado', t:'Se culpó todo el trayecto, convencido de que ya no tenía ninguna posibilidad real.'},
      {e:'curioso', t:'Al entrar, decidió no disculparse ni una sola vez y contar exactamente qué había pasado.'},
      {e:'misterioso', t:'El entrevistador sonrió de una forma que no supo interpretar durante toda la conversación.'},
      {e:'inspirador', t:'Le contrataron esa misma tarde: "Buscábamos a alguien que no mintiera cuando algo sale mal".'}
    ]},
    {title:'El accidente', segments:[
      {e:'neutro', t:'El coche de empresa chocó contra un muro la noche antes de la presentación más importante del año.'},
      {e:'triste', t:'Pensó que todo el trabajo de meses se iba a perder por un golpe de mala suerte.'},
      {e:'curioso', t:'Sin coche ni portátil, tuvo que presentar de memoria, solo con lo que llevaba en la cabeza.'},
      {e:'feliz', t:'Fue la mejor presentación que había hecho nunca: sin diapositivas, solo mirando a los ojos.'},
      {e:'inspirador', t:'Desde entonces presenta siempre así. El accidente le quitó el coche, pero le devolvió la voz.'}
    ]},
    {title:'La mudanza', segments:[
      {e:'neutro', t:'Se mudó de ciudad sin conocer a nadie, solo con dos maletas y un contrato temporal.'},
      {e:'triste', t:'Las primeras semanas comió sola cada noche, mirando el móvil, esperando mensajes que no llegaban.'},
      {e:'curioso', t:'Un vecino dejó una nota bajo su puerta: "Los jueves cocino de más, si te apetece bajar".'},
      {e:'feliz', t:'Ese jueves bajó. Y el siguiente. Hoy ese vecino es el padrino de su primer hijo.'},
      {e:'inspirador', t:'A veces empezar de cero solo necesita que alguien deje una nota bajo la puerta correcta.'}
    ]},
    {title:'El regalo de cumpleaños', segments:[
      {e:'neutro', t:'Su hija de ocho años ahorró seis meses de paga para comprarle un regalo de cumpleaños.'},
      {e:'curioso', t:'Al abrirlo, encontró una libreta barata con una sola frase escrita en la primera página.'},
      {e:'triste', t:'Decía: "Para que apuntes ahí la idea de negocio de la que hablas siempre y nunca escribes".'},
      {e:'inspirador', t:'Esa noche escribió, por primera vez en años, el plan completo de lo que siempre quiso montar.'},
      {e:'feliz', t:'Dos años después, esa libreta sigue en su despacho, encima de todo lo demás.'}
    ]},
    {title:'La competencia', segments:[
      {e:'neutro', t:'Un competidor directo abrió una tienda idéntica a la suya, a doscientos metros de distancia.'},
      {e:'enfadado', t:'Pasó semanas obsesionada con vigilar sus precios, sus redes sociales, cada movimiento que hacían.'},
      {e:'curioso', t:'Un cliente le dijo algo que la hizo parar: "Vosotros ni siquiera contestáis igual de rápido que antes".'},
      {e:'misterioso', t:'Dejó de mirar al competidor por completo, de un día para otro, sin decírselo a nadie.'},
      {e:'inspirador', t:'Un año después, el competidor cerró. Ella nunca supo por qué, y ya no le importaba.'}
    ]},
    {title:'El error del banco', segments:[
      {e:'neutro', t:'El banco ingresó por error cuarenta mil euros de más en la cuenta de la empresa.'},
      {e:'curioso', t:'Su contable le preguntó, muy serio, qué quería hacer antes de que alguien más lo notara.'},
      {e:'enfadado', t:'Pensó en todo lo que ese dinero podría arreglar de golpe, todas las facturas pendientes.'},
      {e:'inspirador', t:'Llamó al banco esa misma tarde y devolvió cada euro, sin que nadie se lo pidiera.'},
      {e:'feliz', t:'Meses después, ese mismo banco le ofreció una línea de crédito que nadie más quería darle.'}
    ]},
    {title:'La reconciliación', segments:[
      {e:'triste', t:'Llevaban cuatro años sin hablarse, desde que la empresa familiar se dividió entre los dos hermanos.'},
      {e:'neutro', t:'Se encontraron por casualidad en la boda de un primo, sentados en la misma mesa.'},
      {e:'enfadado', t:'Las primeras palabras fueron frías, casi de compromiso, recordando viejos reproches sin nombrarlos.'},
      {e:'curioso', t:'Alguien de la mesa preguntó, sin saberlo, por el negocio que montaron juntos hace veinte años.'},
      {e:'inspirador', t:'Hablaron hasta las tres de la madrugada. Hoy vuelven a ser socios, y algo más importante: hermanos otra vez.'}
    ]},
    {title:'El primer día', segments:[
      {e:'neutro', t:'Su primer día como jefa de un equipo que antes eran sus compañeros al mismo nivel.'},
      {e:'curioso', t:'Nadie la miraba igual: unos con respeto nuevo, otros con una distancia que antes no existía.'},
      {e:'enfadado', t:'Uno de ellos, en la reunión, cuestionó cada decisión que tomó delante de todos los demás.'},
      {e:'misterioso', t:'Al terminar, le pidió hablar a solas. Nadie supo qué se dijeron en esa sala.'},
      {e:'inspirador', t:'Hoy ese compañero es su mano derecha. A veces liderar empieza con una conversación incómoda, no evitándola.'}
    ]},
    {title:'La subasta', segments:[
      {e:'neutro', t:'Pujó por el pequeño local que llevaba diez años soñando con convertir en su negocio.'},
      {e:'enfadado', t:'Otro comprador, con mucho más dinero, empezó a subir la puja sin ninguna intención real de quedárselo.'},
      {e:'curioso', t:'Se acercó a él en el descanso y le preguntó, directamente, por qué estaba pujando.'},
      {e:'misterioso', t:'El hombre sonrió: "Solo quería ver hasta dónde estabas dispuesta a llegar por esto".'},
      {e:'feliz', t:'Se retiró de la puja. Ella se quedó el local, al precio que realmente podía pagar.'}
    ]},
    {title:'El mensaje equivocado', segments:[
      {e:'neutro', t:'Envió por error a todo el equipo un mensaje que era solo para su jefe.'},
      {e:'enfadado', t:'En el mensaje se quejaba, con detalle, de la falta de reconocimiento en la empresa.'},
      {e:'misterioso', t:'Nadie respondió durante toda la tarde. El silencio fue mucho peor que cualquier reproche directo.'},
      {e:'curioso', t:'Al día siguiente, su jefe convocó una reunión de equipo sin dar ninguna pista de qué trataría.'},
      {e:'inspirador', t:'Anunció cambios reales en cómo reconocían el trabajo de todos. El error, sin querer, arregló algo roto hace años.'}
    ]},
    {title:'La jubilación', segments:[
      {e:'neutro', t:'Después de cuarenta años en la misma fábrica, hoy era su último día de trabajo.'},
      {e:'triste', t:'Pensó que nadie notaría su ausencia, que sería un día como cualquier otro para los demás.'},
      {e:'curioso', t:'Al llegar a su puesto encontró a toda la fábrica parada, en completo silencio, esperándolo.'},
      {e:'feliz', t:'Habían hecho un libro con una página escrita por cada persona con la que trabajó.'},
      {e:'inspirador', t:'Entendió, por fin, que cuarenta años construyendo en silencio también se notan. Solo hay que dejar espacio para verlo.'}
    ]},
    {title:'El taller del abuelo', segments:[
      {e:'neutro', t:'Heredó el taller mecánico de su abuelo, cerrado desde hacía tres años tras su muerte.'},
      {e:'triste', t:'Todos le dijeron que lo vendiera, que un taller así ya no tenía ningún futuro real.'},
      {e:'curioso', t:'Al limpiarlo encontró un cuaderno con clientes de treinta años atrás, todos con una nota personal al lado.'},
      {e:'inspirador', t:'Decidió reabrirlo con la misma idea: tratar a cada cliente como su abuelo los trataba, uno a uno.'},
      {e:'feliz', t:'Hoy tiene lista de espera. La gente no vuelve por el motor. Vuelve por cómo la tratan.'}
    ]},
    {title:'La última reunión', segments:[
      {e:'neutro', t:'Era la última reunión antes de cerrar definitivamente la empresa que fundó hace quince años.'},
      {e:'triste', t:'Miró a cada uno de sus doce empleados, sabiendo que mañana ya no tendrían trabajo.'},
      {e:'enfadado', t:'Se culpó en voz alta, delante de todos, por decisiones que tomó demasiado tarde.'},
      {e:'curioso', t:'Uno de sus empleados más jóvenes levantó la mano con una propuesta que nadie esperaba escuchar.'},
      {e:'inspirador', t:'Reestructuraron la empresa esa misma noche, más pequeña pero real. Hoy sigue abierta, con la mitad del equipo.'}
    ]},
    {title:'El anillo', segments:[
      {e:'neutro', t:'Perdió el anillo de su boda limpiando el almacén del pequeño negocio familiar.'},
      {e:'enfadado', t:'Pasó dos días enteros buscándolo, culpando a todo el mundo, incluso a sí mismo.'},
      {e:'misterioso', t:'Un cliente habitual, sin decir nada, empezó a ayudarle a revisar caja por caja.'},
      {e:'curioso', t:'Ese cliente le contó, mientras buscaban, que él también había perdido el suyo hace años y nunca lo encontró.'},
      {e:'feliz', t:'Lo encontraron dentro de una caja de tornillos. Desde entonces, ese cliente es su mejor amigo.'}
    ]},
    {title:'La cicatriz', segments:[
      {e:'neutro', t:'En cada entrevista de trabajo le preguntaban por la cicatriz visible en su brazo.'},
      {e:'triste', t:'Durante años inventó excusas, avergonzado del accidente real que la había dejado ahí.'},
      {e:'curioso', t:'En una entrevista decidió, por primera vez, contar la verdad completa, sin adornarla.'},
      {e:'misterioso', t:'El entrevistador se quedó en silencio unos segundos, mirando la mesa, antes de responder.'},
      {e:'inspirador', t:'"A esta empresa le sobran perfectos y le faltan honestos. Empiezas el lunes". Nunca volvió a esconder la cicatriz.'}
    ]},
    {title:'El comienzo', segments:[
      {e:'neutro', t:'A los cincuenta y dos años decidió estudiar lo que nunca pudo estudiar de joven.'},
      {e:'enfadado', t:'En la primera clase, un compañero de veinte años le preguntó, con burla, qué hacía ahí.'},
      {e:'triste', t:'Esa noche estuvo a punto de dejarlo, convencido de que llegaba demasiado tarde para todo.'},
      {e:'curioso', t:'Su hija, sin saberlo, le dejó una nota en la mochila antes de que se fuera a clase.'},
      {e:'inspirador', t:'Decía: "El único momento tarde para empezar es el que ya dejaste pasar". Terminó la carrera con matrícula de honor.'}
    ]}
  ],
  paceTexts:[
    {title:'El anuncio', body:'Hoy... no vengo a venderte nada. (MÁS DESPACIO) Vengo a contarte **una verdad** que casi nadie dice en voz alta. Llevas años trabajando duro... pero trabajar duro no es lo mismo que avanzar. (MÁS RÁPIDO) La diferencia está en las decisiones pequeñas, las que tomas cada mañana, cada reunión, cada "sí" y cada "no". Y esas decisiones... **se entrenan**. Como un músculo. Como cualquier otra cosa que de verdad te importa.'},
    {title:'La despedida', body:'Llevo quince años en esta empresa. (MÁS DESPACIO) Quince años... de errores, de aciertos, de gente que confió en mí sin motivo aparente. Hoy me voy. No porque algo saliera mal. **Al contrario**. Me voy porque por fin sé lo que quiero hacer con el tiempo que me queda. (MÁS RÁPIDO) Y eso, señoras y señores, no tiene precio. Gracias por todo. De verdad.'},
    {title:'El discurso de ventas', body:'Imagina despertar mañana... y que el problema que llevas dos años arrastrando, simplemente, **ya no existe**. Así de fácil. (MÁS DESPACIO) No es magia. Es un sistema. Uno que ya probaron trescientas empresas antes que tú. (MÁS RÁPIDO) La pregunta no es si funciona. La pregunta es cuánto más vas a esperar para empezar.'},
    {title:'La disculpa pública', body:'Cometí un error. (MÁS DESPACIO) Uno grande. Y en vez de esconderlo, prefiero estar aquí, delante de vosotros, y decirlo con todas las letras: **me equivoqué**. No busco excusas. Busco que sepáis que lo he entendido. (MÁS RÁPIDO) Y que a partir de hoy, las cosas van a cambiar. De verdad. Empezando ahora mismo.'},
    {title:'El brindis de boda', body:'Conocí a estos dos... por separado, hace más años de los que quiero admitir. (MÁS DESPACIO) Y nunca, ni una sola vez, imaginé que acabarían el uno frente al otro, hoy, aquí. Hay personas que se buscan toda la vida sin saberlo. (MÁS RÁPIDO) Por estos dos. Por lo que ya construyeron... y por **todo lo que les queda**.'},
    {title:'El lanzamiento del producto', body:'Llevamos dos años en silencio. (MÁS DESPACIO) Dos años escuchando lo que de verdad necesitabais, no lo que era fácil construir. Hoy... por fin... podemos enseñároslo. (MÁS RÁPIDO) No es una actualización más. Es **el producto que debimos lanzar desde el principio**. Y ya está aquí.'},
    {title:'La charla motivacional', body:'Nadie va a venir a salvarte. (MÁS DESPACIO) Ni tu jefe, ni el mercado, ni la suerte. **Nadie**. Y en el momento en que lo aceptas de verdad... algo cambia. (MÁS RÁPIDO) Dejas de esperar el momento perfecto y empiezas con lo que tienes hoy, ahora, en esta sala.'},
    {title:'El discurso de fin de año', body:'Este año... no fue el que planeamos. (MÁS DESPACIO) Hubo meses duros. Hubo dudas, hubo noches sin dormir preguntándonos si merecía la pena seguir. (MÁS RÁPIDO) Pero seguimos aquí. **Enteros**. Y eso, en un año así, ya es una victoria que merece brindarse.'},
    {title:'La llamada al equipo', body:'Quiero que me miréis un segundo. (MÁS DESPACIO) Sé que llevamos semanas duras... y sé que algunos ya dudáis de si esto va a salir bien. (MÁS RÁPIDO) Yo también dudé. Pero hemos llegado hasta aquí sin rendirnos ni una sola vez, y **eso no lo va a parar un mal trimestre**.'},
    {title:'La negociación', body:'Antes de que digas nada... quiero ser claro con algo. (MÁS DESPACIO) No estoy aquí para ganar yo y que pierdas tú. Eso no dura. (MÁS RÁPIDO) Quiero un acuerdo que en un año todavía nos parezca **justo a los dos**. Empecemos por ahí, no por el precio.'},
    {title:'El pitch de ascensor', body:'Tienes treinta segundos, así que voy directo. (MÁS RÁPIDO) Ayudamos a empresas a recuperar el tiempo que pierden en tareas repetitivas... con IA que de verdad usan, no que solo prueban una vez. (MÁS DESPACIO) En seis meses, nuestros clientes ahorran de media diez horas por semana. **Esa es la conversación que quiero tener contigo**.'},
    {title:'El discurso de graduación', body:'Hace cuatro años, la mayoría de vosotros no se conocía. (MÁS DESPACIO) Hoy salís de aquí con algo que no estaba en ningún programa: la certeza de que **podéis con más de lo que pensabais**. (MÁS RÁPIDO) El mundo ahí fuera no os va a esperar. Así que no le deis motivos para dudar de vosotros.'},
    {title:'La crisis de la empresa', body:'Sé que ha llegado la noticia antes que yo. (MÁS DESPACIO) Y sé que da miedo. A mí también me lo da. Pero prefiero decíroslo yo, de frente, a que os enteréis por rumores. (MÁS RÁPIDO) Esto es lo que sabemos hoy... y esto es **exactamente** lo que vamos a hacer a partir de mañana.'},
    {title:'El agradecimiento', body:'No estaría aquí arriba sin al menos veinte personas en esta sala. (MÁS DESPACIO) Gente que confió en mí cuando yo mismo no confiaba. Que me sostuvo cuando quise dejarlo. (MÁS RÁPIDO) Así que esto... **no es mío**. Es de todos los que me sostuvieron sin que yo se lo pidiera.'},
    {title:'La advertencia', body:'Voy a deciros algo que no os va a gustar oír. (MÁS DESPACIO) Si seguimos así... en un año no va a quedar empresa que salvar. No es una amenaza. Es un cálculo. (MÁS RÁPIDO) Así que hoy, ahora, tenemos que decidir qué estamos dispuestos a cambiar. **Hoy, no el mes que viene**.'},
    {title:'El discurso de bienvenida', body:'Bienvenido a un lugar donde nadie te va a decir "esto siempre se hizo así". (MÁS DESPACIO) Aquí valoramos más una buena pregunta que una respuesta segura. (MÁS RÁPIDO) Vas a equivocarte, y **está bien**. Lo que no está bien es no intentarlo por miedo a equivocarte delante de nosotros.'},
    {title:'La reconciliación pública', body:'Llevamos meses sin hablarnos como se merece esta empresa. (MÁS DESPACIO) Y una parte de esto es culpa mía, lo reconozco aquí, delante de todos. (MÁS RÁPIDO) Pero hoy quiero proponer algo distinto: empezar de cero, con las cartas sobre la mesa, **sin rencores guardados para después**.'},
    {title:'La despedida de un compañero', body:'Diez años trabajando codo con codo... no se resumen en un discurso de tres minutos. (MÁS DESPACIO) Pero voy a intentarlo. Este hombre me enseñó más de lo que cualquier curso me enseñó nunca. (MÁS RÁPIDO) Que tengas la suerte, en tu próximo reto, de encontrar un equipo que **te eche tanto de menos** como nosotros hoy.'},
    {title:'El cierre de campaña', body:'Nos quedan tres días. (MÁS DESPACIO) Tres días para decidir si de verdad creemos en lo que llevamos meses defendiendo, o si lo dejamos aquí, a medias. (MÁS RÁPIDO) Yo no he venido hasta aquí para quedarme a medias. Y **vosotros tampoco**.'},
    {title:'El discurso improvisado', body:'No tenía preparado nada de esto, así que perdonad si no sale perfecto. (MÁS DESPACIO) Pero cuando me han pedido que suba aquí, he pensado en una sola cosa: lo que casi nunca decimos en voz alta. (MÁS RÁPIDO) Que **esto**, lo que hemos construido, no era nada obvio que fuera a funcionar. Y funcionó.'}
  ],

function loadState(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || defaultState(); }
  catch(e){ return defaultState(); }
}
function defaultState(){
  return { xp:0, streak:0, lastDone:null, totalSeconds:0, history:[], weakPoints:{} };
}
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
let S = loadState();

function levelFromXP(xp){ return Math.floor(xp/150)+1; }
function xpIntoLevel(xp){ return xp % 150; }
function rankFromLevel(lvl){
  if(lvl>=100) return 'S'; if(lvl>=70) return 'A'; if(lvl>=45) return 'B';
  if(lvl>=25) return 'C'; if(lvl>=10) return 'D'; return 'E';
}
function fmtTime(sec){
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60);
  if(h>0) return h+'h '+m+'m';
  return m+'m';
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function isYesterday(iso){
  const d=new Date(iso+'T00:00:00'); const y=new Date(); y.setDate(y.getDate()-1);
  return d.toDateString()===y.toDateString();
}
const EPOCH = Date.UTC(2026,0,5); // lunes
function weekIndex(){
  const d = new Date();
  const days = Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - EPOCH)/86400000);
  return Math.floor(days/7);
}
// Rotación secuencial: cada tipo de día sale 1×/semana, así recorre
// el banco entero antes de repetir nada.
function seedIndex(salt, len){
  let off=0; for(let i=0;i<salt.length;i++){ off=(off*31+salt.charCodeAt(i))>>>0; }
  return ((weekIndex() + off) % len + len) % len;
}
function todayDayType(){ return DAY_TYPE[new Date().getDay()]; }
function doneToday(){
  return S.history.some(h=>h.date===todayISO());
}
function completeSession(dayType, seconds, extra){
  const already = doneToday();
  const lvlBefore = levelFromXP(S.xp);
  const rankBefore = rankFromLevel(lvlBefore);
  S.totalSeconds += seconds;
  if(!already){
    if(S.lastDone && isYesterday(S.lastDone)) S.streak += 1;
    else if(S.lastDone !== todayISO()) S.streak = 1;
    S.lastDone = todayISO();
    S.xp += 50 + Math.min(S.streak*2, 40);
  }
  S.history.push(Object.assign({date:todayISO(), day:new Date().getDay(), type:dayType, seconds:seconds}, extra||{}));
  saveState();

  const lvlAfter = levelFromXP(S.xp);
  const rankAfter = rankFromLevel(lvlAfter);
  if(rankAfter !== rankBefore){
    sfxRankUp(); vibrate([40,30,40,30,80]); flashScreen(true);
    showToast('RANGO ' + rankAfter, 'Has subido de rango');
  } else if(lvlAfter > lvlBefore){
    sfxLevelUp(); vibrate([30,20,50]); flashScreen(true);
    showToast('NIVEL ' + lvlAfter, 'Has subido de nivel');
  } else {
    sfxComplete(); vibrate(25); flashScreen(false);
  }
}
function showToast(title, sub){
  const el = document.createElement('div');
  el.className = 'levelup-toast';
  el.innerHTML = `<div class="mono" style="font-size:1.7rem;font-weight:900;color:var(--gold)">${title}</div>
                  <div class="dim">${sub}</div>`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}
function registerWeakPoints(dims){
  dims.forEach(d=>{ S.weakPoints[d]=(S.weakPoints[d]||0)+1; });
  saveState();
}

let ROUTE = {name:'home'};
function go(name, params){ ROUTE = Object.assign({name:name}, params||{}); render(); window.scrollTo(0,0); }

function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

function render(){
  const app = document.getElementById('app');
  app.innerHTML = TEMPLATES[ROUTE.name](ROUTE);
  bindRouteEvents();
}

function bindRouteEvents(){
  if(ROUTE.name==='train') bindTrainEvents();
  if(ROUTE.name==='extra') bindExtraEvents();
}

// ---------- TRAIN FLOW ----------
let TRAIN = {};
function startTrain(type){
  const active = document.querySelectorAll('.dur');
  const sel = document.querySelector('.dur.primary') || document.querySelector('.dur');
  const duration = parseInt(sel.getAttribute('data-d'),10);
  TRAIN = {type, duration, startedAt:Date.now(), fillerCount:0};
  ROUTE = {name:'train', type, duration};
  document.getElementById('app').innerHTML = TEMPLATES.train(ROUTE);
  renderTrainBody();
}
document.addEventListener('click', e=>{
  if(e.target.classList && e.target.classList.contains('dur')){
    document.querySelectorAll('.dur').forEach(b=>b.classList.remove('primary'));
    e.target.classList.add('primary');
  }
});

function renderTrainBody(){
  const area = document.getElementById('trainArea');
  const type = TRAIN.type;
  if(type==='emociones') return renderEmociones(area);
  if(type==='velocidad') return renderVelocidad(area);
  if(type==='storytelling') return renderStorytelling(area);
  if(type==='vender') return renderVender(area);
  if(type==='improvisacion') return renderImprovisacion(area);
  if(type==='comunicador') return renderComunicador(area);
  if(type==='feedback') return renderFeedback(area);
}

function parsePaceText(body){
  let html = body
    .replace(/\*\*(.+?)\*\*/g, '<span class="emph">$1</span>')
    .replace(/\(MÁS DESPACIO\)/g, '<span class="speed-tag">MÁS DESPACIO</span>')
    .replace(/\(MÁS RÁPIDO\)/g, '<span class="speed-tag">MÁS RÁPIDO</span>')
    .replace(/\.\.\./g, '<span class="pause-long">(pausa larga)</span>')
    .replace(/(?<!\.)\.(?!\.)/g, '.<span class="pause-short"> · </span>');
  return html;
}

function renderVelocidad(area){
  const text = CONTENT.paceTexts[seedIndex('velocidad', CONTENT.paceTexts.length)];
  area.innerHTML = `
  <div class="hud-panel">
    <h3 class="glow-cyan">${text.title}</h3>
    <button class="btn ghost" id="ttsBtn">🔊 Escuchar voz de referencia</button>
    <p style="line-height:1.9;margin-top:14px">${parsePaceText(text.body)}</p>
    <button class="big-btn" onclick="finishTraining()">He terminado de leerlo</button>
  </div>`;
  const btn = area.querySelector('#ttsBtn');
  btn.onclick = ()=>{
    if(!('speechSynthesis' in window)){ btn.textContent='Tu navegador no soporta voz'; return; }
    const u = new SpeechSynthesisUtterance(text.body.replace(/\*\*/g,'').replace(/\(MÁS[^)]+\)/g,''));
    u.lang='es-ES'; u.rate=0.95;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  };
}

function renderEmociones(area){
  const story = CONTENT.stories[seedIndex('emociones', CONTENT.stories.length)];
  let idx=0;
  const perSeg = Math.max(8, Math.floor(TRAIN.duration/story.segments.length));
  area.innerHTML = `<div class="hud-panel">
    <div class="dim" id="emoProgress"></div>
    <h3 class="glow-cyan">${story.title}</h3>
    <div id="emoBadge"></div>
    <p id="emoText" style="font-size:1.05rem;line-height:1.8;min-height:120px"></p>
    <div class="timer mono" id="emoTimer">${perSeg}</div>
    <div class="dim" style="text-align:center">segundos en este fragmento</div>
    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="emoPrev()">◀ Anterior</button>
      <button class="btn primary" onclick="emoNext()">Siguiente ▶</button>
    </div>
    <button class="big-btn" onclick="finishTraining()" style="margin-top:16px">Terminar historia</button>
  </div>`;
  let timeLeft = perSeg, iv=null;
  function paint(){
    const seg = story.segments[idx];
    const em = EMOTIONS[seg.e];
    document.getElementById('emoBadge').innerHTML = `<div class="emotion-badge" style="background:${em.color}22;color:${em.color};border:1px solid ${em.color}">${em.emoji} ${em.label.toUpperCase()}</div>`;
    document.getElementById('emoText').textContent = seg.t;
    document.getElementById('emoProgress').textContent = 'FRAGMENTO ' + (idx+1) + ' DE ' + story.segments.length;
    timeLeft = perSeg;
    document.getElementById('emoTimer').textContent = timeLeft;
    sfxEmotion(); vibrate(15);
  }
  function tick(){
    timeLeft--; const t=document.getElementById('emoTimer'); if(t) t.textContent=Math.max(timeLeft,0);
    if(timeLeft<=0 && idx<story.segments.length-1){ idx++; paint(); }
  }
  window.emoNext = ()=>{ if(idx<story.segments.length-1){ idx++; paint(); } };
  window.emoPrev = ()=>{ if(idx>0){ idx--; paint(); } };
  paint();
  clearInterval(window.__emoIv); window.__emoIv = setInterval(tick,1000);
}

function enableMirror(video, btn){
  navigator.mediaDevices.getUserMedia({video:true, audio:false}).then(stream=>{
    video.srcObject = stream; video.style.display='block'; btn.textContent='Cámara activa';
    video._stream = stream;
  }).catch(()=>{ btn.textContent='Cámara no disponible aquí'; });
}

function fmtClock(sec){ const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
function runCountdown(seconds, onDone){
  let left=seconds;
  const cd = document.getElementById('cd');
  const btn = document.getElementById('startCd');
  if(btn) btn.disabled=true;
  sfxStart(); vibrate(20);
  clearInterval(window.__cdIv);
  window.__cdIv = setInterval(()=>{
    left--; if(cd) cd.textContent = fmtClock(Math.max(left,0));
    if(left>0 && left<=3) sfxTick();
    if(left<=0){ clearInterval(window.__cdIv); sfxTimeUp(); vibrate([60,40,60]); onDone(); }
  },1000);
}

function goSelfEval(dims, extra){
  const area = document.getElementById('trainArea');
  area.innerHTML = `<div class="hud-panel">
    <h3 class="glow-cyan">Autoevaluación</h3>
    <div id="sliders">${dims.map(d=>`
      <div class="slider-row">
        <label><span>${d}</span><span class="mono" id="v_${escId(d)}">5</span></label>
        <input type="range" min="1" max="10" value="5" data-dim="${d}" oninput="document.getElementById('v_${escId(d)}').textContent=this.value">
      </div>`).join('')}</div>
    <button class="big-btn" onclick="submitSelfEval(${JSON.stringify(dims).replace(/"/g,'&quot;')}, ${JSON.stringify(extra||{}).replace(/"/g,'&quot;')})">Guardar y terminar</button>
  </div>`;
}
function escId(d){ return d.replace(/[^a-zA-Z0-9]/g,'_'); }

function submitSelfEval(dims, extra){
  stopTimers();
  const scores = {};
  dims.forEach(d=>{ const inp=document.querySelector(`input[data-dim="${d}"]`); scores[d]=parseInt(inp.value,10); });
  completeSession(TRAIN.type, TRAIN.duration, Object.assign({scores}, extra||{}));
  if(extra && extra.isSunday){
    const sorted = Object.entries(scores).sort((a,b)=>a[1]-b[1]).slice(0,3).map(x=>x[0]);
    registerWeakPoints(sorted);
    showSummary(scores, sorted);
  } else {
    go('home');
  }
}

function showSummary(scores, weakest){
  const vals = Object.values(scores);
  const avg = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10);
  const best = Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const app = document.getElementById('app');
  app.innerHTML = `<div class="hud-panel" style="text-align:center">
    <div class="dim">INFORME SEMANAL</div>
    <div class="mono" style="font-size:3.4rem;font-weight:900;color:var(--cyan);text-shadow:0 0 22px rgba(53,232,255,.55);line-height:1">${avg}</div>
    <div class="dim">sobre 100</div>
  </div>
  <div class="hud-panel">
    <h3 class="glow-purple">Tus 3 focos de la semana que viene</h3>
    ${weakest.map((w,i)=>`<div style="display:flex;gap:10px;align-items:baseline;margin:8px 0">
      <span class="mono" style="color:var(--danger);font-weight:900">${i+1}</span>
      <span>${w} <span class="dim mono">${scores[w]}/10</span></span></div>`).join('')}
  </div>
  <div class="hud-panel">
    <h3>Lo que ya dominas</h3>
    ${best.map(b=>`<div class="dim">✓ ${b[0]} <span class="mono">${b[1]}/10</span></div>`).join('')}
  </div>
  <button class="big-btn" onclick="go('home')">Volver al inicio</button>`;
}

function finishTraining(){
  stopTimers();

    <div id="q" style="min-height:60px;font-size:1.05rem"></div>

  </div>`;
  const qbox = area.querySelector('#q');
  function paint(){ qbox.textContent = CONTENT.interviewQuestions[qi % CONTENT.interviewQuestions.length]; qi++; }
  paint();
  area.querySelector('#nextQ').onclick = paint;
}

function toggleSound(){
  localStorage.setItem('orador_sound', soundOn() ? 'off' : 'on');
  if(soundOn()) sfxTap();
  render();
}

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* sin offline, la app sigue funcionando */ });
  });
}
</script>
