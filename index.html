<style>
/* Tema oscuro único y deliberado: es una "System UI" de Solo Leveling,
   un modo claro rompería el lenguaje de glow sobre negro. */
:root{
  color-scheme:dark;
  --bg:#05070c; --panel:#0b1119; --panel2:#0e1622;
  --cyan:#35e8ff; --purple:#a45bff; --pink:#ff3fb0;
  --text:#dfe8f5; --dim:#7688a3; --danger:#ff5f6d; --gold:#ffc24b;
  --line:rgba(53,232,255,.22);
  --font-head:'Avenir Next Condensed','HelveticaNeue-CondensedBold','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,'JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
body{
  margin:0; min-height:100vh; background:
    radial-gradient(circle at 20% -10%, rgba(164,91,255,.18), transparent 45%),
    radial-gradient(circle at 100% 10%, rgba(63,240,255,.14), transparent 40%),
    var(--bg);
  color:var(--text); font-family:var(--font-body); letter-spacing:.01em;
  overflow-x:hidden;
}
#app{max-width:520px;margin:0 auto;padding:18px 16px 60px;min-height:100vh}
.hud-panel{
  background:linear-gradient(180deg, var(--panel), var(--panel2));
  border:1px solid var(--line);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  position:relative; padding:16px; margin-bottom:14px;
}
.hud-panel::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 20px rgba(63,240,255,.05);
}
.glow-cyan{color:var(--cyan);text-shadow:0 0 12px rgba(63,240,255,.6)}
.glow-purple{color:var(--purple);text-shadow:0 0 12px rgba(164,91,255,.6)}
h1,h2,h3{font-family:var(--font-head);margin:0 0 6px;font-weight:800;letter-spacing:.03em}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim);font-size:.8rem}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.brand{font-size:1.4rem;font-weight:900;letter-spacing:.15em}
.brand span{color:var(--cyan)}
.rank-badge{

  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);

  box-shadow:0 0 24px rgba(63,240,255,.15);

.big-btn:active{transform:scale(.98)}
.btn{
  display:inline-block;padding:10px 16px;background:var(--panel2);

}
.btn.primary{border-color:var(--cyan);color:var(--cyan)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.1);color:var(--dim)}

.row{display:flex;gap:8px;flex-wrap:wrap}

.tag{display:inline-block;font-family:var(--font-mono);font-size:.65rem;padding:2px 8px;border-radius:10px;background:rgba(164,91,255,.15);color:var(--purple);margin-left:6px}
.locked{opacity:.45}
.nav{display:flex;gap:6px;margin-top:22px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
.nav .btn{flex:1;font-size:.75rem;padding:8px 4px}
.pulse-word{font-family:var(--font-mono);font-weight:900;font-size:1.05rem;color:var(--purple);padding:6px 10px;border:1px dashed var(--purple);border-radius:4px;text-align:center}
video.mirror{width:100%;border-radius:8px;transform:scaleX(-1);background:#000;margin-bottom:10px}
.pause-short{color:var(--dim)}
.pause-long{color:var(--purple);font-weight:900}
.emph{color:var(--gold);font-weight:900}
.speed-tag{font-family:var(--font-mono);font-size:.7rem;color:var(--pink);border:1px solid var(--pink);border-radius:3px;padding:1px 6px;margin:0 4px;white-space:nowrap;display:inline-block}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:10px}
.heat .hm{
  aspect-ratio:1;border-radius:2px;background:rgba(255,255,255,.06);
  border:1px solid transparent;
}
.heat .hm.on{background:linear-gradient(135deg,var(--cyan),var(--purple));box-shadow:0 0 6px rgba(53,232,255,.4)}
.heat .hm.now{border-color:var(--gold)}
#prompterWrap{
  height:240px;overflow:hidden;position:relative;margin-top:12px;
  border:1px solid rgba(53,232,255,.3);border-radius:6px;
  background:rgba(0,0,0,.4);
}
#prompterInner{
  padding:16px;font-size:1.45rem;line-height:1.75;font-weight:600;
  will-change:transform;
}
/* degradado arriba y abajo: la línea legible queda en el centro */
#prompterMask{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(5,7,12,.95) 0%,transparent 30%,transparent 70%,rgba(5,7,12,.95) 100%);
}
.phase-box{
  background:rgba(164,91,255,.08);border:1px solid rgba(164,91,255,.35);
  border-radius:6px;padding:12px;margin:14px 0;min-height:96px;
}
.phase-box:empty{display:none}
.phase-title{font-family:var(--font-head);font-size:1.5rem;font-weight:900;color:var(--purple);letter-spacing:.02em}
/* acotación de interpretación: cómo decirlo, no qué decir */
.stage-note{
  font-style:italic;color:var(--purple);font-size:.9rem;line-height:1.5;
  border-left:2px solid var(--purple);padding:2px 0 2px 10px;margin:0 0 14px;
}

/* en movil: respeta la barra de estado / notch al instalarse como app */
#app{padding-top:calc(18px + env(safe-area-inset-top));padding-bottom:calc(60px + env(safe-area-inset-bottom))}
/* evita el zoom por doble toque y el retardo de 300ms en iOS */
button,.item,.d{touch-action:manipulation}

.flash-overlay{
  position:fixed;inset:0;pointer-events:none;z-index:99;
  background:radial-gradient(circle at 50% 50%, rgba(53,232,255,.35), transparent 70%);
  animation:flashfade .65s ease-out forwards;
}
.flash-overlay.gold{background:radial-gradient(circle at 50% 50%, rgba(255,194,75,.4), transparent 70%)}
@keyframes flashfade{from{opacity:1}to{opacity:0}}
.levelup-toast{
  position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:100;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--gold);padding:16px 26px;text-align:center;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  box-shadow:0 0 40px rgba(255,194,75,.3);animation:flashfade 2.4s ease-out forwards;
}
.sound-toggle{
  background:none;border:1px solid rgba(255,255,255,.15);color:var(--dim);
  border-radius:4px;padding:4px 9px;cursor:pointer;font-size:.95rem;line-height:1;
}

<script>
/* ---------------- sonido (motor portado de la app de hábitos) ----------------
   El arreglo clave para iOS: si programas un sonido en un AudioContext todavía
   "suspended", el sonido se descarta en silencio — no da error, no suena.
   whenRunning() no programa nada hasta que el motor confirma que está corriendo. */
let audioCtx = null;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function soundOn(){ return localStorage.getItem('orador_sound') !== 'off'; }
function whenRunning(fn){
  if(!soundOn()) return;
  try{
    const ctx = getCtx();
    if(ctx.state === 'running'){ fn(ctx); return; }
    ctx.resume().then(()=>{ if(ctx.state === 'running') fn(ctx); }).catch(()=>{});
  }catch(e){ /* audio no disponible */ }
}
let audioUnlockDone = false;
function unlockAudio(){
  if(audioUnlockDone) return;
  whenRunning(ctx=>{
    try{
      const b = ctx.createBuffer(1,1,22050);
      const s = ctx.createBufferSource();
      s.buffer = b; s.connect(ctx.destination); s.start(0);
      audioUnlockDone = true;
    }catch(e){}
  });
}
// se reintenta en cada toque de los primeros, no solo en el primero: así el motor
// ya está caliente cuando el usuario toca el botón que de verdad suena
['touchstart','touchend','mousedown','click'].forEach(evt=>{
  document.addEventListener(evt, unlockAudio, {capture:true});
});

function beep(freq,duration,type,startTime,gainVal){
  whenRunning(ctx=>{ try{
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type=type; osc.frequency.value=freq;
    osc.connect(gain).connect(ctx.destination);
    const t=ctx.currentTime+startTime;
    osc.start(t);
    gain.gain.setValueAtTime(gainVal,t);
    gain.gain.exponentialRampToValueAtTime(0.001,t+duration);
    osc.stop(t+duration+0.02);
  }catch(e){} });
}
function sweep(f1,f2,duration,startTime,gainVal,type){
  whenRunning(ctx=>{ try{
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type=type||'sawtooth';
    const t=ctx.currentTime+startTime;
    osc.frequency.setValueAtTime(f1,t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    gain.gain.setValueAtTime(gainVal,t);
    gain.gain.exponentialRampToValueAtTime(0.001,t+duration);
    osc.stop(t+duration+0.02);
  }catch(e){} });
}
function thump(freq,duration,startTime,gainVal){
  whenRunning(ctx=>{ try{
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type='sine';
    const t=ctx.currentTime+startTime;
    osc.frequency.setValueAtTime(freq,t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1,freq*0.4),t+duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    gain.gain.setValueAtTime(gainVal,t);
    gain.gain.exponentialRampToValueAtTime(0.001,t+duration);
    osc.stop(t+duration+0.02);
  }catch(e){} });
}
function noiseBurst(duration,startTime,gainVal,filterFreq,filterType){
  whenRunning(ctx=>{ try{
    const size=Math.max(1,Math.floor(ctx.sampleRate*duration));
    const buffer=ctx.createBuffer(1,size,ctx.sampleRate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<size;i++) data[i]=Math.random()*2-1;
    const noise=ctx.createBufferSource(); noise.buffer=buffer;
    const filter=ctx.createBiquadFilter();
    filter.type=filterType||'bandpass';
    filter.frequency.value=filterFreq||1200;
    const gain=ctx.createGain();
    const t=ctx.currentTime+startTime;
    gain.gain.setValueAtTime(gainVal,t);
    gain.gain.exponentialRampToValueAtTime(0.001,t+duration);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(t); noise.stop(t+duration+0.02);
  }catch(e){} });
}
function vibrate(pattern){
  try{ if(navigator.vibrate && soundOn()) navigator.vibrate(pattern); }catch(e){}
}
function flashScreen(gold){
  const el=document.createElement('div');
  el.className='flash-overlay'+(gold?' gold':'');
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),650);
}

/* sonidos con nombre */
function sfxTap(){ beep(880,0.03,'square',0,0.05); }
function sfxStart(){
  sweep(300,1200,0.22,0,0.07,'sawtooth');
  noiseBurst(0.12,0,0.03,3500,'highpass');
  beep(1400,0.08,'square',0.2,0.08);
}
function sfxTick(){ beep(1000,0.04,'square',0,0.07); }
function sfxTimeUp(){
  beep(880,0.12,'square',0,0.10);
  beep(660,0.12,'square',0.13,0.10);
  beep(440,0.22,'square',0.26,0.10);
  thump(110,0.3,0.26,0.12);
}
function sfxComplete(){
  beep(1200,0.05,'square',0,0.12);
  beep(1800,0.08,'square',0.05,0.10);
  thump(150,0.12,0,0.10);
}
function sfxFiller(){ beep(220,0.09,'sawtooth',0,0.09); }
function sfxEmotion(){ beep(1320,0.05,'sine',0,0.06); }
function sfxLevelUp(){
  sweep(300,2400,0.45,0,0.08,'sawtooth');
  noiseBurst(0.3,0,0.05,4000,'highpass');
  [523.25,659.25,783.99,1046.5,1318.51].forEach((f,i)=>beep(f,0.16,'square',0.15+i*0.09,0.10));
  thump(90,0.3,0.5,0.14);
}
function sfxRankUp(){
  sweep(150,3200,0.6,0,0.09,'sawtooth');
  noiseBurst(0.4,0,0.06,6000,'highpass');
  [196,392,523.25,659.25,783.99,1046.5,1318.51].forEach((f,i)=>beep(f,0.2,'triangle',0.1+i*0.08,0.11));
  thump(60,0.45,0.65,0.16);
}

const LS_KEY='orador_v4_state';
const DAY_NAMES=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DAY_TYPE=['feedback','emociones','velocidad','storytelling','vender','improvisacion','comunicador'];
const DAY_LABEL={
  emociones:'Emociones', velocidad:'Velocidad y pausas', storytelling:'Storytelling',
  vender:'Vender una idea', improvisacion:'Improvisación', comunicador:'Copia a un gran comunicador', feedback:'Feedback'
};

const EMOTIONS={
  neutro:{emoji:'🟢',label:'Neutro',color:'#3ff0ff'},
  curioso:{emoji:'🟡',label:'Curioso',color:'#ffcf5c'},
  enfadado:{emoji:'🔴',label:'Enfadado',color:'#ff4d5e'},
  triste:{emoji:'🔵',label:'Triste',color:'#5b9dff'},
  feliz:{emoji:'🟠',label:'Feliz',color:'#ff9a3f'},
  inspirador:{emoji:'🟣',label:'Inspirador',color:'#a45bff'},
  misterioso:{emoji:'⚫',label:'Misterioso',color:'#9aa5b8'}
};

/* CONTENT vive ahora en content.js */

function loadState(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || defaultState(); }
  catch(e){ return defaultState(); }
}
function defaultState(){
  return { xp:0, streak:0, lastDone:null, totalSeconds:0, history:[], weakPoints:{} };
}
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
let S = loadState();

function levelFromXP(xp){ return Math.floor(xp/150)+1; }
function xpIntoLevel(xp){ return xp % 150; }
function rankFromLevel(lvl){
  if(lvl>=100) return 'S'; if(lvl>=70) return 'A'; if(lvl>=45) return 'B';
  if(lvl>=25) return 'C'; if(lvl>=10) return 'D'; return 'E';
}
function fmtTime(sec){
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60);
  if(h>0) return h+'h '+m+'m';
  return m+'m';
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function isYesterday(iso){
  const d=new Date(iso+'T00:00:00'); const y=new Date(); y.setDate(y.getDate()-1);
  return d.toDateString()===y.toDateString();
}
const EPOCH = Date.UTC(2026,0,5); // lunes
function weekIndex(){
  const d = new Date();
  const days = Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - EPOCH)/86400000);
  return Math.floor(days/7);
}
// Rotación secuencial: cada tipo de día sale 1×/semana, así recorre
// el banco entero antes de repetir nada.
function seedIndex(salt, len){
  let off=0; for(let i=0;i<salt.length;i++){ off=(off*31+salt.charCodeAt(i))>>>0; }
  return ((weekIndex() + off) % len + len) % len;
}
function todayDayType(){ return DAY_TYPE[new Date().getDay()]; }

/* Días en los que LEES un texto: la duración la marca el texto, no un selector.
   Antes se anunciaban 5 min y el texto duraba 30 segundos. */
const READING_DAYS = ['emociones','velocidad','comunicador'];
function countWords(t){ return (String(t).match(/[\wáéíóúüñÁÉÍÓÚÜÑ']+/g)||[]).length; }
// 115 palabras/min: leer actuando emociones y respetando pausas es más lento
// que leer normal (~140). Medido sobre los propios textos de la app.
function readingSeconds(words){ return Math.round(words/115*60); }
function storyWords(story){ return story.segments.reduce((a,s)=>a+countWords(s.t),0); }
function fmtMins(sec){
  const m = Math.round(sec/60);
  return m<1 ? '<1 min' : m+' min';
}
// cuánto dura de verdad el contenido de hoy, para cada tipo de día
function estimatedSeconds(type){
  if(type==='emociones')   return readingSeconds(storyWords(CONTENT.stories[seedIndex('emociones', CONTENT.stories.length)]));
  if(type==='velocidad')   return readingSeconds(countWords(CONTENT.paceTexts[seedIndex('velocidad', CONTENT.paceTexts.length)].body));
  if(type==='comunicador') return readingSeconds(Math.round(CONTENT.communicators.reduce((a,c)=>a+countWords(c.speech),0)/CONTENT.communicators.length));
  return null;
}
function doneToday(){
  return S.history.some(h=>h.date===todayISO());
}
function completeSession(dayType, seconds, extra){
  const already = doneToday();
  const lvlBefore = levelFromXP(S.xp);
  const rankBefore = rankFromLevel(lvlBefore);
  S.totalSeconds += seconds;
  if(!already){
    if(S.lastDone && isYesterday(S.lastDone)) S.streak += 1;
    else if(S.lastDone !== todayISO()) S.streak = 1;
    S.lastDone = todayISO();
    S.xp += 50 + Math.min(S.streak*2, 40);
  }
  S.history.push(Object.assign({date:todayISO(), day:new Date().getDay(), type:dayType, seconds:seconds}, extra||{}));
  saveState();

  const lvlAfter = levelFromXP(S.xp);
  const rankAfter = rankFromLevel(lvlAfter);
  if(rankAfter !== rankBefore){
    sfxRankUp(); vibrate([40,30,40,30,80]); flashScreen(true);
    showToast('RANGO ' + rankAfter, 'Has subido de rango');
  } else if(lvlAfter > lvlBefore){
    sfxLevelUp(); vibrate([30,20,50]); flashScreen(true);
    showToast('NIVEL ' + lvlAfter, 'Has subido de nivel');
  } else {
    sfxComplete(); vibrate(25); flashScreen(false);
  }
}
function heatmapHTML(){
  const done = new Set(S.history.map(h=>h.date));
  const today = new Date();
  let cells = '';
  for(let i=55;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const iso = d.toISOString().slice(0,10);
    const isToday = i===0;
    cells += `<div class="hm ${done.has(iso)?'on':''} ${isToday?'now':''}" title="${iso}"></div>`;
  }
  return `<div class="heat">${cells}</div>`;
}
const ALL_LABELS = Object.assign({}, DAY_LABEL, {
  'extra-podcast':'Podcast', 'extra-debate':'Debate',
  'extra-reunion':'Reunión', 'extra-entrevista':'Entrevista'
});
function typeLabel(t){ return ALL_LABELS[t] || t; }
function byTypeHTML(){
  const labels = ALL_LABELS;
  const counts = {};
  S.history.forEach(h=>{ counts[h.type] = (counts[h.type]||0)+1; });
  const rows = Object.keys(labels).map(k=>({k, n:counts[k]||0}));
  if(!S.history.length) return '<div class="dim">Cuando lleves unas sesiones, aquí verás qué días te saltas.</div>';
  const max = Math.max(...rows.map(r=>r.n), 1);
  return rows.sort((a,b)=>b.n-a.n).map(r=>`
    <div style="display:flex;align-items:center;gap:8px;margin:5px 0">
      <div style="flex:0 0 42%;font-size:.82rem">${labels[r.k]}</div>
      <div style="flex:1;height:7px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden">
        <div style="width:${Math.round(r.n/max*100)}%;height:100%;background:${r.n?'linear-gradient(90deg,var(--cyan),var(--purple))':'transparent'}"></div>
      </div>
      <div class="mono dim" style="flex:0 0 22px;text-align:right">${r.n}</div>
    </div>`).join('');
}
function showToast(title, sub){
  const el = document.createElement('div');
  el.className = 'levelup-toast';
  el.innerHTML = `<div class="mono" style="font-size:1.7rem;font-weight:900;color:var(--gold)">${title}</div>
                  <div class="dim">${sub}</div>`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}
function registerWeakPoints(dims){
  dims.forEach(d=>{ S.weakPoints[d]=(S.weakPoints[d]||0)+1; });
  saveState();
}

let ROUTE = {name:'home'};
function go(name, params){ ROUTE = Object.assign({name:name}, params||{}); render(); window.scrollTo(0,0); }

function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

function render(){
  const app = document.getElementById('app');
  app.innerHTML = TEMPLATES[ROUTE.name](ROUTE);
  bindRouteEvents();
}

function bindRouteEvents(){
  if(ROUTE.name==='train') bindTrainEvents();
  if(ROUTE.name==='extra') bindExtraEvents();
}

// ---------- TRAIN FLOW ----------
let TRAIN = {};
function startTrain(type){
  const active = document.querySelectorAll('.dur');
  const sel = document.querySelector('.dur.primary') || document.querySelector('.dur');
  const duration = parseInt(sel.getAttribute('data-d'),10);
  TRAIN = {type, duration, startedAt:Date.now(), fillerCount:0};
  ROUTE = {name:'train', type, duration};
  document.getElementById('app').innerHTML = TEMPLATES.train(ROUTE);
  renderTrainBody();
}
document.addEventListener('click', e=>{
  if(e.target.classList && e.target.classList.contains('dur')){
    document.querySelectorAll('.dur').forEach(b=>b.classList.remove('primary'));
    e.target.classList.add('primary');
  }
});

function renderTrainBody(){
  const area = document.getElementById('trainArea');
  const type = TRAIN.type;
  if(type==='emociones') return renderEmociones(area);
  if(type==='velocidad') return renderVelocidad(area);
  if(type==='storytelling') return renderStorytelling(area);
  if(type==='vender') return renderVender(area);
  if(type==='improvisacion') return renderImprovisacion(area);
  if(type==='comunicador') return renderComunicador(area);
  if(type==='feedback') return renderFeedback(area);
}

function parsePaceText(body){
  let html = body
    .replace(/\*\*(.+?)\*\*/g, '<span class="emph">$1</span>')
    .replace(/\(MÁS DESPACIO\)/g, '<span class="speed-tag">MÁS DESPACIO</span>')
    .replace(/\(MÁS RÁPIDO\)/g, '<span class="speed-tag">MÁS RÁPIDO</span>')
    .replace(/\.\.\./g, '<span class="pause-long">(pausa larga)</span>')
    .replace(/(?<!\.)\.(?!\.)/g, '.<span class="pause-short"> · </span>');
  return html;
}

function renderVelocidad(area){
  const text = CONTENT.paceTexts[seedIndex('velocidad', CONTENT.paceTexts.length)];
  area.innerHTML = `
  <div class="hud-panel">
    <h3 class="glow-cyan">${text.title}</h3>
    <div class="stage-note">${text.intro||''}</div>
    <button class="btn ghost" id="ttsBtn">🔊 Escuchar voz de referencia</button>
    <p style="line-height:1.95;margin-top:14px;font-size:1.05rem">${parsePaceText(text.body)}</p>
    <button class="big-btn" onclick="finishTraining()">He terminado de leerlo</button>
  </div>`;
  const btn = area.querySelector('#ttsBtn');
  btn.onclick = ()=>{
    if(!('speechSynthesis' in window)){ btn.textContent='Tu navegador no soporta voz'; return; }
    const u = new SpeechSynthesisUtterance(text.body.replace(/\*\*/g,'').replace(/\(MÁS[^)]+\)/g,''));
    u.lang='es-ES'; u.rate=0.95;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  };
}

function renderEmociones(area){
  const story = CONTENT.stories[seedIndex('emociones', CONTENT.stories.length)];
  let idx=0;
  const perSeg = Math.max(8, Math.floor(TRAIN.duration/story.segments.length));
  area.innerHTML = `<div class="hud-panel">
    <div class="dim" id="emoProgress"></div>
    <h3 class="glow-cyan">${story.title}</h3>
    <div id="emoBadge"></div>
    <div class="stage-note" id="emoNote"></div>
    <p id="emoText" style="font-size:1.1rem;line-height:1.85;min-height:120px"></p>
    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="emoPrev()">◀ Anterior</button>
      <button class="btn primary" style="flex:1" onclick="emoNext()">Siguiente ▶</button>
    </div>
    <div class="dim" style="text-align:center;margin-top:8px">Sin prisa: pasa tú de fragmento cuando lo tengas.</div>
    <button class="big-btn" onclick="finishTraining()" style="margin-top:16px">Terminar historia</button>
  </div>`;
  function paint(){
    const seg = story.segments[idx];
    const em = EMOTIONS[seg.e];
    document.getElementById('emoBadge').innerHTML = `<div class="emotion-badge" style="background:${em.color}22;color:${em.color};border:1px solid ${em.color}">${em.emoji} ${em.label.toUpperCase()}</div>`;
    document.getElementById('emoNote').textContent = seg.d || '';
    document.getElementById('emoText').textContent = seg.t;
    document.getElementById('emoProgress').textContent = 'FRAGMENTO ' + (idx+1) + ' DE ' + story.segments.length;
    sfxEmotion(); vibrate(15);
  }
  window.emoNext = ()=>{ if(idx<story.segments.length-1){ idx++; paint(); } };
  window.emoPrev = ()=>{ if(idx>0){ idx--; paint(); } };
  paint();
}

function enableMirror(video, btn){
  navigator.mediaDevices.getUserMedia({video:true, audio:false}).then(stream=>{
    video.srcObject = stream; video.style.display='block'; btn.textContent='Cámara activa';
    video._stream = stream;
  }).catch(()=>{ btn.textContent='Cámara no disponible aquí'; });
}

function fmtClock(sec){ const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }

    {at:0.40, title:'La solución', hint:'Ahora sí: qué es y cómo funciona. Concreto.'},
    {at:0.65, title:'La objeción', hint:'Di en voz alta la pega que te va a poner. Y respóndela.'},
    {at:0.85, title:'Cierra',      hint:'Pide algo concreto. Un sí o un no, no un "ya te diré".'}
  ],
  improvisacion:[
    {at:0,    title:'Tu postura',  hint:'Di ya lo que piensas. Sin calentamiento.'},
    {at:0.15, title:'Por qué',     hint:'La primera razón, la más fuerte.'},
    {at:0.40, title:'Un ejemplo',  hint:'Algo real que te haya pasado a ti o a alguien que conoces.'},
    {at:0.65, title:'La otra cara',hint:'¿Qué diría alguien que piensa lo contrario? Dilo tú.'},
    {at:0.85, title:'Cierra',      hint:'Vuelve a tu postura, ahora con más matices.'}
  ],
  feedback:[
    {at:0,    title:'Cómo ha ido la semana', hint:'Sin pensarlo mucho. Lo primero que te salga.'},
    {at:0.25, title:'Lo que mejor salió',    hint:'Cuéntalo con detalle, como si fuera una historia.'},
    {at:0.55, title:'Lo que se atascó',      hint:'Qué pasó exactamente y qué harías distinto.'},
    {at:0.80, title:'La semana que viene',   hint:'Una sola cosa concreta. Dilo en voz alta.'}
  ]
};
PHASES.podcast = PHASES.improvisacion;

function phaseAt(type, elapsedRatio){
  const list = PHASES[type];
  if(!list) return null;
  let cur = list[0], next = null;
  for(let i=0;i<list.length;i++){
    if(elapsedRatio >= list[i].at){ cur = list[i]; next = list[i+1] || null; }
  }
  return {cur, next};
}
function renderPhase(type, elapsedRatio){
  const box = document.getElementById('phaseBox');
  if(!box) return;
  const p = phaseAt(type, elapsedRatio);
  if(!p){ box.innerHTML=''; return; }
  box.innerHTML = `
    <div class="dim">AHORA</div>
    <div class="phase-title">${p.cur.title}</div>
    <div class="stage-note" style="margin:6px 0 0">${p.cur.hint}</div>
    ${p.next ? `<div class="dim" style="margin-top:8px">Después: ${p.next.title}</div>` : ''}`;
}

let PAUSED = false;
function runCountdown(seconds, onDone, type){
  let left = seconds;
  const cd = document.getElementById('cd');
  const btn = document.getElementById('startCd');
  const pauseBtn = document.getElementById('pauseCd');
  if(btn) btn.style.display = 'none';
  if(pauseBtn) pauseBtn.style.display = 'block';
  PAUSED = false;
  sfxStart(); vibrate(20);
  renderPhase(type, 0);
  clearInterval(window.__cdIv);
  window.__cdIv = setInterval(()=>{
    if(PAUSED) return;
    left--;
    if(cd) cd.textContent = fmtClock(Math.max(left,0));
    renderPhase(type, 1 - left/seconds);
    if(left>0 && left<=3) sfxTick();
    if(left<=0){ clearInterval(window.__cdIv); sfxTimeUp(); vibrate([60,40,60]); onDone(); }
  },1000);
}
function togglePause(){
  PAUSED = !PAUSED;
  const b = document.getElementById('pauseCd');
  if(b) b.textContent = PAUSED ? '▶ Reanudar' : '❚❚ Pausa';
  sfxTap();
}

// Agrupamos las 13 del domingo: de golpe son un muro y se pasa de largo
// dejándolo todo en 5, que da siempre 50/100 y no sirve de nada.
const DIM_GROUPS = {
  'Voz':['Claridad','Ritmo adecuado','Vocalización','Uso de pausas','Variación de tono'],
  'Presencia':['Energía','Mirada a cámara','Sonrisa','Expresividad','Confianza'],
  'Contenido':['Hablar sin muletillas','Storytelling','Persuasión']
};
function groupOf(dim){
  for(const g in DIM_GROUPS) if(DIM_GROUPS[g].includes(dim)) return g;
  return null;
}
function sliderRow(d){
  return `<div class="slider-row">
    <label><span>${d}</span><span class="mono" id="v_${escId(d)}">5</span></label>
    <input type="range" min="1" max="10" value="5" data-dim="${d}" oninput="document.getElementById('v_${escId(d)}').textContent=this.value">
  </div>`;
}
function goSelfEval(dims, extra){
  const area = document.getElementById('trainArea');
  const grouped = dims.length > 6 && dims.every(d=>groupOf(d));
  let body;
  if(grouped){
    body = Object.keys(DIM_GROUPS).map(g=>`
      <div style="margin-bottom:18px">
        <div class="dim" style="letter-spacing:.12em;margin-bottom:4px">${g.toUpperCase()}</div>
        ${DIM_GROUPS[g].filter(d=>dims.includes(d)).map(sliderRow).join('')}
      </div>`).join('');
  } else {
    body = dims.map(sliderRow).join('');
  }
  area.innerHTML = `<div class="hud-panel">
    <h3 class="glow-cyan">Autoevaluación</h3>
    <p class="dim">10 = lo hiciste bien. Sé honesto: de esto salen tus 3 focos de la semana.</p>
    <div id="sliders">${body}</div>
    <button class="big-btn" onclick="submitSelfEval(${JSON.stringify(dims).replace(/"/g,'&quot;')}, ${JSON.stringify(extra||{}).replace(/"/g,'&quot;')})">Guardar y terminar</button>
  </div>`;
}
function escId(d){ return d.replace(/[^a-zA-Z0-9]/g,'_'); }

function submitSelfEval(dims, extra){
  stopTimers();
  const scores = {};
  dims.forEach(d=>{ const inp=document.querySelector(`input[data-dim="${d}"]`); scores[d]=parseInt(inp.value,10); });
  completeSession(TRAIN.type, TRAIN.duration, Object.assign({scores}, extra||{}));
  if(extra && extra.isSunday){
    const sorted = Object.entries(scores).sort((a,b)=>a[1]-b[1]).slice(0,3).map(x=>x[0]);
    registerWeakPoints(sorted);
    showSummary(scores, sorted);
  } else {
    go('home');
  }
}

function showSummary(scores, weakest){
  const vals = Object.values(scores);
  const avg = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10);
  const best = Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const app = document.getElementById('app');
  app.innerHTML = `<div class="hud-panel" style="text-align:center">
    <div class="dim">INFORME SEMANAL</div>
    <div class="mono" style="font-size:3.4rem;font-weight:900;color:var(--cyan);text-shadow:0 0 22px rgba(53,232,255,.55);line-height:1">${avg}</div>
    <div class="dim">sobre 100</div>
  </div>
  <div class="hud-panel">
    <h3 class="glow-purple">Tus 3 focos de la semana que viene</h3>
    ${weakest.map((w,i)=>`<div style="display:flex;gap:10px;align-items:baseline;margin:8px 0">
      <span class="mono" style="color:var(--danger);font-weight:900">${i+1}</span>
      <span>${w} <span class="dim mono">${scores[w]}/10</span></span></div>`).join('')}
  </div>
  <div class="hud-panel">
    <h3>Lo que ya dominas</h3>
    ${best.map(b=>`<div class="dim">✓ ${b[0]} <span class="mono">${b[1]}/10</span></div>`).join('')}
  </div>
  <button class="big-btn" onclick="go('home')">Volver al inicio</button>`;
}

function finishTraining(){
  stopTimers();
  completeSession(TRAIN.type, TRAIN.duration, {});
  go('home');
}
function stopTimers(){
  clearInterval(window.__emoIv); clearInterval(window.__cdIv);
}
function abortTraining(){
  // si ya había empezado el cronómetro, avisamos: salir pierde la sesión
  const empezado = !!window.__cdIv || !!window.__emoIv;
  if(empezado && !confirm('¿Salir del entrenamiento? No se guardará esta sesión.')) return;
  stopTimers();
  go('home');
}

// ---------- EXTRA MODES ----------
function bindExtraEvents(){
  const mode = ROUTE.mode;
  const area = document.getElementById('extraArea');
  if(!area) return;
  if(mode==='camara') return renderCamara(area);
  if(mode==='podcast') return renderPodcast(area);
  if(mode==='debate') return renderDebate(area);
  if(mode==='reunion') return renderReunion(area);
  if(mode==='entrevista') return renderEntrevista(area);
}

function renderCamara(area){
  // Un teleprompter necesita un texto largo de verdad. Antes tenía dos líneas
  // y hacía scroll de 200px, que no servía de nada.
  const story = CONTENT.stories[seedIndex('camara', CONTENT.stories.length)];
  const full = story.segments.map(s=>s.t).join(' ');
  area.innerHTML = `<div class="hud-panel">
    <h3 class="glow-cyan">Teleprompter</h3>
    <p class="dim">Texto: "${story.title}". Habla mirando a la cámara, no al texto.</p>
    <button class="btn ghost" id="camBtn2" style="width:100%">🎥 Activar cámara</button>
    <video class="mirror" id="mirror2" style="display:none" autoplay muted playsinline></video>
    <div id="prompterWrap">
      <div id="prompterInner">${full}</div>
      <div id="prompterMask"></div>
    </div>
    <div class="dim" style="margin-top:10px">Velocidad</div>
    <div class="row">
      <button class="btn spd" data-s="0.55">Lenta</button>
      <button class="btn primary spd" data-s="0.85">Normal</button>
      <button class="btn spd" data-s="1.25">Rápida</button>
    </div>
    <button class="btn primary" id="scrollBtn" style="width:100%;margin-top:10px">▶ Iniciar</button>
    <button class="btn ghost" id="resetBtn" style="width:100%;margin-top:6px">↺ Volver al principio</button>
  </div>`;
  const inner = area.querySelector('#prompterInner');
  let speed = 0.85, raf = null, pos = 0, running = false;
  area.querySelectorAll('.spd').forEach(b=>{
    b.onclick = ()=>{
      area.querySelectorAll('.spd').forEach(x=>x.classList.remove('primary'));
      b.classList.add('primary');
      speed = parseFloat(b.dataset.s);
      sfxTap();
    };
  });
  function step(){
    if(!running) return;
    pos += speed;
    inner.style.transform = 'translateY(' + (-pos) + 'px)';
    if(pos < inner.scrollHeight) raf = requestAnimationFrame(step);
    else { running = false; area.querySelector('#scrollBtn').textContent = '▶ Iniciar'; }
  }
  const scrollBtn = area.querySelector('#scrollBtn');
  scrollBtn.onclick = ()=>{
    running = !running;
    scrollBtn.textContent = running ? '❚❚ Pausa' : '▶ Continuar';
    sfxTap();
    if(running) raf = requestAnimationFrame(step); else cancelAnimationFrame(raf);
  };
  area.querySelector('#resetBtn').onclick = ()=>{
    running = false; cancelAnimationFrame(raf); pos = 0;
    inner.style.transform = 'translateY(0)';
    area.querySelector('#scrollBtn').textContent = '▶ Iniciar';
  };
  area.querySelector('#camBtn2').onclick = ()=> enableMirror(area.querySelector('#mirror2'), area.querySelector('#camBtn2'));
}
function renderPodcast(area){
  const topic = CONTENT.improvTopics[seedIndex('podcast', CONTENT.improvTopics.length)];
  area.innerHTML = `<div class="hud-panel">
    <h3 class="glow-purple">Solo audio, sin cámara</h3>
    <h2 class="glow-cyan">${topic}</h2>
    <p class="dim">Como si grabaras un podcast: sin gestos, todo tiene que estar en la voz.</p>
    <div id="phaseBox" class="phase-box"></div>
    <div class="timer mono" id="cd">5:00</div>
    <button class="btn ghost" id="pauseCd" onclick="togglePause()" style="display:none;width:100%;margin-top:8px">❚❚ Pausa</button>
    <button class="big-btn" id="startCd">▶ Empezar</button>
  </div>`;
  TRAIN = {type:'extra-podcast', duration:300};
  area.querySelector('#startCd').onclick = ()=> runCountdown(300, ()=> finishExtra('Podcast'), 'podcast');
}
function renderDebate(area){
  const d = CONTENT.debateTopics[seedIndex('debate', CONTENT.debateTopics.length)];
  let ri = 0;
  area.innerHTML = `<div class="hud-panel">
    <h3 class="glow-cyan">Defiende esta postura</h3>
    <h2>${d.topic}</h2>
    <p class="dim">Defiéndela en voz alta aunque no estés de acuerdo. Cuando te quedes sin argumentos, pide contraataque.</p>
    <div id="rebuttal" class="phase-box" style="min-height:70px"></div>
    <button class="btn primary" id="nextR" style="width:100%">⚔️ Contraataque 1</button>
    <div class="timer mono" id="cd" style="margin-top:14px">3:00</div>
    <button class="btn ghost" id="pauseCd" onclick="togglePause()" style="display:none;width:100%;margin-top:8px">❚❚ Pausa</button>
    <button class="big-btn" id="startCd">▶ Empezar</button>
  </div>`;
  TRAIN = {type:'extra-debate', duration:180};
  const rbox = area.querySelector('#rebuttal');
  const btn = area.querySelector('#nextR');
  btn.onclick = ()=>{
    rbox.innerHTML = '<div class="dim">TE RESPONDE</div><div style="font-size:1.05rem;margin-top:4px">'
      + d.rebuttals[ri % d.rebuttals.length] + '</div>';
    ri++;
    btn.textContent = '⚔️ Contraataque ' + (ri+1);
    sfxFiller(); vibrate(25);
  };
  area.querySelector('#startCd').onclick = ()=> runCountdown(180, ()=> finishExtra('Debate'));
}
function renderReunion(area){
  let li = seedIndex('reunion', CONTENT.meetingLines.length);
  area.innerHTML = `<div class="hud-panel">
    <h3 class="glow-cyan">Reunión con cliente difícil</h3>
    <p class="dim">Responde en voz alta a cada objeción, como si lo tuvieras delante.</p>
    <div id="line" class="phase-box" style="min-height:70px"></div>
    <button class="btn primary" id="nextL" style="width:100%">Siguiente objeción</button>
    <div class="timer mono" id="cd" style="margin-top:14px">5:00</div>
    <button class="btn ghost" id="pauseCd" onclick="togglePause()" style="display:none;width:100%;margin-top:8px">❚❚ Pausa</button>
    <button class="big-btn" id="startCd">▶ Empezar</button>
  </div>`;
  TRAIN = {type:'extra-reunion', duration:300};
  const lbox = area.querySelector('#line');
  function paint(){
    lbox.innerHTML = '<div class="dim">EL CLIENTE DICE</div><div style="font-size:1.05rem;margin-top:4px">'
      + CONTENT.meetingLines[li % CONTENT.meetingLines.length].replace(/^El cliente dice: /,'') + '</div>';
    li++; sfxEmotion(); vibrate(15);
  }
  paint();
  area.querySelector('#nextL').onclick = paint;
  area.querySelector('#startCd').onclick = ()=> runCountdown(300, ()=> finishExtra('Reunión'));
}
function renderEntrevista(area){
  let qi = seedIndex('entrevista', CONTENT.interviewQuestions.length);
  area.innerHTML = `<div class="hud-panel">
    <h3 class="glow-cyan">Entrevista inesperada</h3>
    <p class="dim">Contesta sin prepararlo. Si dudas más de tres segundos, esa es justo la que hay que trabajar.</p>
    <div id="q" class="phase-box" style="min-height:70px"></div>
    <button class="btn primary" id="nextQ" style="width:100%">Siguiente pregunta</button>
    <div class="timer mono" id="cd" style="margin-top:14px">5:00</div>
    <button class="btn ghost" id="pauseCd" onclick="togglePause()" style="display:none;width:100%;margin-top:8px">❚❚ Pausa</button>
    <button class="big-btn" id="startCd">▶ Empezar</button>
  </div>`;
  TRAIN = {type:'extra-entrevista', duration:300};
  const qbox = area.querySelector('#q');
  function paint(){
    qbox.innerHTML = '<div class="dim">TE PREGUNTAN</div><div style="font-size:1.05rem;margin-top:4px">'
      + CONTENT.interviewQuestions[qi % CONTENT.interviewQuestions.length] + '</div>';
    qi++; sfxEmotion(); vibrate(15);
  }
  paint();
  area.querySelector('#nextQ').onclick = paint;
  area.querySelector('#startCd').onclick = ()=> runCountdown(300, ()=> finishExtra('Entrevista'));
}

// los modos extra ahora cuentan: suman tiempo, XP y racha como cualquier sesión
function finishExtra(nombre){
  stopTimers();
  completeSession(TRAIN.type || 'extra', TRAIN.duration || 300, {modo:nombre});
  setTimeout(()=>go('home'), 1200);
}

function toggleSound(){
  localStorage.setItem('orador_sound', soundOn() ? 'off' : 'on');
  if(soundOn()) sfxTap();
  render();
}

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* sin offline, la app sigue funcionando */ });
  });
}
</script>
